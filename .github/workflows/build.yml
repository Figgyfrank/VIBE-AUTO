name: Build DRIPMIX (Windows VST3)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target DripMix_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse build/DripMix_artefacts/Release/VST3/DRIPMIX.vst3 out/
          Compress-Archive -Path out/DRIPMIX.vst3 -DestinationPath DRIPMIX-vst3-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DRIPMIX-vst3-windows
          path: DRIPMIX-vst3-windows.zip

      - name: Publish build to dripmix-release branch
        shell: pwsh
        run: |
          git config user.name "dripmix-bot"
          git config user.email "noreply@github.com"
          New-Item -ItemType Directory -Force -Path rel | Out-Null
          Copy-Item DRIPMIX-vst3-windows.zip rel/
          Set-Location rel
          git init -q -b dripmix-release
          git add -A
          git commit -q -m "DRIPMIX Windows VST3 build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dripmix-release
